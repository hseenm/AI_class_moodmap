<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>旅遊尋寶趣</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #f4f4f9; line-height: 1.6; }
  .container { background: white; padding: 20px; border-radius: 8px; max-width: 600px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
  .hidden { display: none; }
  .question-block { margin-bottom: 25px; border-bottom: 1px dashed #ccc; padding-bottom: 15px; }
  .question-text { font-weight: bold; margin-bottom: 10px; }
  .options-group { display: flex; flex-direction: column; gap: 8px; }
  button { background: #0056b3; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; }
  button:hover { background: #004494; }
  .result-item { padding: 15px; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 15px; background: #fff; }
  .place-name { font-size: 18px; font-weight: bold; color: #333; }
  .match-score { font-size: 18px; color: #e67e22; font-weight: bold; float: right; }
  #loading { text-align: center; font-size: 18px; color: #555; margin-top: 20px; }
</style>
</head>
<body>

<div class="container" id="quiz-page">
  <h2>心情導向尋寶測驗</h2>
  <div id="questions-container"></div>
  <button onclick="calculateResult()">分析心情並尋找景點</button>
</div>

<div class="container hidden" id="loading-page">
  <div id="loading">AI 正在為你思考專屬行程 請稍候...</div>
</div>

<div class="container hidden" id="result-page">
  <h2>AI 為你推薦的專屬景點</h2>
  <div id="places-list"></div>
  <button onclick="location.reload()" style="margin-top:20px; background:#6c757d;">重新測驗</button>
</div>

<script>
  // 請在這裡貼上你申請到的 Google AI Studio 金鑰
  const API_KEY = "AIzaSyATawQg3YN88377eyhZHH3LAup26E0HxiY";

  const questions = [
    "我現在覺得精神百倍想要盡情活動",
    "我渴望享受獨處的安靜時光",
    "我現在想吃點好吃的來犒賞自己",
    "我想要去戶外呼吸新鮮空氣",
    "我覺得壓力有點大需要徹底放鬆",
    "我想要探索沒去過的新鮮地方",
    "我現在對音樂或文創藝術充滿興趣",
    "我想要進行一些消耗體力的行程",
    "我想要沉浸在懷舊復古的氛圍中",
    "我覺得有點疲憊不想思考太複雜的事"
  ];

  const options = [
    { label: "非常不同意", value: "非常不同意" },
    { label: "不同意", value: "不同意" },
    { label: "普通", value: "普通" },
    { label: "同意", value: "同意" },
    { label: "非常同意", value: "非常同意" }
  ];

  const qContainer = document.getElementById('questions-container');
  
  questions.forEach((qText, index) => {
    let html = `<div class="question-block"><div class="question-text">第 ${index + 1} 題：${qText}</div><div class="options-group">`;
    options.forEach(opt => {
      html += `<label><input type="radio" name="q${index}" value="${opt.value}"> ${opt.label}</label>`;
    });
    html += `</div></div>`;
    qContainer.innerHTML += html;
  });

  async function calculateResult() {
    let userSummary = "";
    let answered = 0;
    
    for (let i = 0; i < questions.length; i++) {
      const selected = document.querySelector(`input[name="q${i}"]:checked`);
      if (selected) {
        userSummary += `對於「${questions[i]}」這件事 使用者的態度是：${selected.value} \n`;
        answered++;
      }
    }

    if (answered < questions.length) {
      alert("請完成所有題目才能進行精準分析");
      return;
    }

    document.getElementById('quiz-page').classList.add('hidden');
    document.getElementById('loading-page').classList.remove('hidden');

    const promptText = `
      你是一位具備心理學背景的彰化在地旅遊達人
      請分析以下使用者的心情狀態：
      ${userSummary}
      
      請推薦三個位於彰化縣且真實存在的景點或店家
      地點必須契合使用者的當下情緒
      請嚴格遵守輸出格式
      只能回傳純 JSON 陣列格式
      請勿包含任何其他標記或 markdown 符號
      [
        {
          "name": "景點名稱",
          "matchPercentage": 95,
          "description": "地點特色與推薦理由"
        }
      ]
    `;

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${API_KEY}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }]
        })
      });

      if (!response.ok) {
        const errorData = await response.text();
        console.error("API 回傳錯誤代碼:", errorData);
        alert("API 呼叫失敗 請按 F12 查看主控台的錯誤代碼");
        document.getElementById('loading-page').classList.add('hidden');
        document.getElementById('quiz-page').classList.remove('hidden');
        return;
      }

      const data = await response.json();
      let textResult = data.candidates[0].content.parts[0].text;
      
      textResult = textResult.replace(/```json/g, "").replace(/```/g, "").trim();
      const places = JSON.parse(textResult);

      document.getElementById('loading-page').classList.add('hidden');
      document.getElementById('result-page').classList.remove('hidden');

      let listHtml = "";
      places.forEach(place => {
        listHtml += `
          <div class="result-item">
            <span class="place-name">${place.name}</span>
            <span class="match-score">${place.matchPercentage}% 推薦</span>
            <p style="margin-top:10px; color:#555;">${place.description}</p>
          </div>
        `;
      });
      document.getElementById('places-list').innerHTML = listHtml;

    } catch (error) {
      console.error("程式執行與解析錯誤:", error);
      alert("發生錯誤 請按 F12 打開 Console 主控台查看詳細原因");
      document.getElementById('loading-page').classList.add('hidden');
      document.getElementById('quiz-page').classList.remove('hidden');
    }
  }
</script>
</body>
</html>
