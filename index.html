<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>旅遊尋寶趣</title>
<style>
  /* 基礎全域設定優化 */
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    padding: 20px; 
    background: #f1f5f9; /* 更柔和的背景色 */
    line-height: 1.6; 
    margin: 0;
    color: #334155;
  }
  
  .container { 
    background: white; 
    padding: 30px; 
    border-radius: 16px; /* 更圓潤的現代感 */
    max-width: 600px; 
    margin: 0 auto; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
  }
  
  .hidden { display: none; }
  
  .question-text { 
    font-size: 22px; 
    font-weight: bold; 
    margin-bottom: 24px; 
    text-align: center; 
    color: #0f172a; 
  }
  
  .options-group { display: flex; flex-direction: column; gap: 14px; }
  
  .option-btn { 
    background: #f8fafc; 
    color: #334155; 
    border: 2px solid #e2e8f0; 
    padding: 16px; 
    border-radius: 12px; 
    cursor: pointer; 
    font-size: 16px; 
    font-weight: 600;
    transition: all 0.2s ease; 
    text-align: center; 
    -webkit-tap-highlight-color: transparent; /* 移除手機點擊閃爍 */
  }
  
  .option-btn:hover, .option-btn:active { 
    background: #3b82f6; 
    color: white; 
    border-color: #3b82f6; 
    transform: translateY(-1px);
  }
  
  .progress-text { 
    text-align: center; 
    color: #64748b; 
    font-size: 14px; 
    margin-bottom: 24px; 
    font-weight: 500;
  }
  
  .result-item { 
    padding: 20px; 
    border: 1px solid #e2e8f0; 
    border-radius: 12px; 
    margin-bottom: 16px; 
    background: #f8fafc; 
  }
  
  .place-name { font-size: 18px; font-weight: bold; color: #0f172a; }
  .match-score { font-size: 16px; color: #e67e22; font-weight: bold; float: right; }
  
  #loading { text-align: center; font-size: 16px; color: #64748b; margin-top: 20px; font-weight: 500; }
  
  .restart-btn { 
    background: #64748b; 
    color: white; 
    border: none; 
    padding: 16px 20px; 
    border-radius: 12px; 
    cursor: pointer; 
    font-size: 16px; 
    font-weight: bold;
    width: 100%; 
    margin-top: 20px; 
  }
  
  .map-btn { 
    display: block; 
    background: #10b981; 
    color: white; 
    text-decoration: none; 
    padding: 14px 15px; 
    border-radius: 10px; 
    font-size: 15px; 
    font-weight: bold; 
    text-align: center; 
    margin-top: 16px; 
    transition: background 0.2s;
  }
  
  .map-btn:hover, .map-btn:active { background: #059669; }

  .text-input { 
    width: 100%; 
    height: 120px; 
    padding: 16px; 
    border-radius: 12px; 
    border: 2px solid #e2e8f0; 
    font-size: 16px; /* 必須設定為16px，防止 iOS 自動放大 */
    box-sizing: border-box; 
    resize: vertical; 
    margin-bottom: 16px; 
    font-family: inherit; 
    color: #334155;
    background: #f8fafc;
  }
  
  .text-input:focus { border-color: #3b82f6; outline: none; background: white; }
  
  .action-group { display: flex; gap: 12px; }
  .submit-btn { background: #3b82f6; color: white; border-color: #3b82f6; flex: 2; }
  .skip-btn { background: #94a3b8; color: white; border-color: #94a3b8; flex: 1; }
  .skip-btn:hover, .skip-btn:active { background: #64748b; border-color: #64748b; }

  /* 針對手機螢幕的專屬調整 */
  @media (max-width: 600px) {
    body { padding: 15px 10px; }
    .container { padding: 20px; border-radius: 12px; }
    .question-text { font-size: 20px; margin-bottom: 20px; }
    .option-btn { padding: 14px; font-size: 15px; }
    .action-group { flex-direction: column-reverse; } /* 手機上將略過按鈕放到最下方避免誤觸 */
    .submit-btn, .skip-btn { width: 100%; flex: none; }
  }
</style>
</head>
<body>

<div class="container" id="quiz-page">
  <h2 style="text-align: center; color: #0f172a; margin-top: 0;">心情導向尋寶測驗</h2>
  <div class="progress-text" id="progress"></div>
  <div class="question-text" id="question-title"></div>
  <div class="options-group" id="options-container"></div>
</div>

<div class="container hidden" id="loading-page">
  <div id="loading">正在獲取您的位置與分析行程...<br>請稍候</div>
</div>

<div class="container hidden" id="result-page">
  <h2 style="text-align: center; color: #0f172a; margin-top: 0;">AI 專屬推薦景點</h2>
  <p id="location-status" style="text-align: center; color: #64748b; font-size: 13px; margin-top: -10px; margin-bottom: 20px;"></p>
  <div id="places-list"></div>
  <button class="restart-btn" onclick="location.reload()">重新測驗</button>
</div>


<script>
  

  const questions = [
    "我現在覺得精神百倍想要盡情活動",
    "我渴望享受獨處的安靜時光",
    "我現在想吃點好吃的來犒賞自己",
    "我想要去戶外呼吸新鮮空氣",
    "我覺得壓力有點大需要徹底放鬆",
    "我想要探索沒去過的新鮮地方",
    "我現在對音樂或文創藝術充滿興趣",
    "我想要進行一些消耗體力的行程",
    "我想要沉浸在懷舊復古的氛圍中",
    "我覺得有點疲憊不想思考太複雜的事"
  ];

  const options = ["非常不同意", "不同意", "普通", "同意", "非常同意"];

  let currentIndex = 0;
  let userSummary = "";

  const progressEl = document.getElementById('progress');
  const questionTitleEl = document.getElementById('question-title');
  const optionsContainer = document.getElementById('options-container');

  function renderQuestion() {
    progressEl.innerText = `目前進度：第 ${currentIndex + 1} 題 / 共 11 題`;
    questionTitleEl.innerText = questions[currentIndex];
    
    optionsContainer.innerHTML = "";
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt;
      btn.onclick = () => selectOption(opt);
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(answer) {
    userSummary += `對於「${questions[currentIndex]}」這件事 使用者的態度是：${answer} \n`;
    currentIndex++;

    if (currentIndex < questions.length) {
      renderQuestion();
    } else {
      renderTextQuestion();
    }
  }

  function renderTextQuestion() {
    progressEl.innerText = `目前進度：第 11 題 / 共 11 題 (加碼題)`;
    questionTitleEl.innerHTML = "最後，你想用一段話具體描述現在的心情嗎？<br><span style='font-size: 14px; color: #64748b; font-weight: normal; margin-top: 8px; display: block;'>(系統將會讀取您的GPS位置，尋找周邊景點)</span>";
    
    optionsContainer.innerHTML = `
      <textarea id="mood-text" class="text-input" placeholder="例如：剛剛上完一整天的課覺得腦袋很脹，想找個安靜的地方喝杯飲料放空..."></textarea>
      <div class="action-group">
        <button class="option-btn skip-btn" onclick="skipTextMood()">直接略過</button>
        <button class="option-btn submit-btn" onclick="submitTextMood()">送出並分析</button>
      </div>
    `;
  }

  function submitTextMood() {
    const text = document.getElementById('mood-text').value.trim();
    if (text !== "") {
      userSummary += `\n使用者額外補充的具體心情描述：「${text}」\n請務必將這段文字納入最優先的推薦考量。`;
    }
    requestLocationAndSubmit();
  }

  function skipTextMood() {
    requestLocationAndSubmit();
  }

  function requestLocationAndSubmit() {
    document.getElementById('quiz-page').classList.add('hidden');
    document.getElementById('loading-page').classList.remove('hidden');

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          document.getElementById('location-status').innerText = "📍 已根據您目前的位置（方圓 10 公里內）進行推薦";
          submitToAI(lat, lng);
        },
        (error) => {
          console.warn("無法取得 GPS 位置，改為無距離限制推薦");
          document.getElementById('location-status').innerText = "⚠️ 無法讀取位置，已改為全區推薦";
          submitToAI(null, null);
        },
        { timeout: 10000 }
      );
    } else {
      document.getElementById('location-status').innerText = "⚠️ 瀏覽器不支援定位，已改為全區推薦";
      submitToAI(null, null);
    }
  }

  async function submitToAI(lat, lng) {
    let locationPrompt = "";
    if (lat !== null && lng !== null) {
      locationPrompt = `非常重要：使用者目前的 GPS 座標為 緯度 ${lat}, 經度 ${lng}。請你「嚴格限制」只推薦距離此座標「方圓 10 公里以內」的景點或店家！如果不在此範圍內請不要推薦。`;
    } else {
      locationPrompt = `請推薦位於台灣的優質景點或店家。`;
    }

    const promptText = `
      你是一位具備心理學背景的在地旅遊達人
      請分析以下使用者的心情狀態：
      ${userSummary}
      
      ${locationPrompt}
      地點必須契合使用者的當下情緒，且必須是真實存在的。
      請嚴格遵守輸出格式
      只能回傳純 JSON 陣列格式
      請勿包含任何其他標記或 markdown 符號
      [
        {
          "name": "景點名稱",
          "matchPercentage": 95,
          "description": "地點特色與推薦理由（請在說明中順便提及大約距離使用者多遠）"
        }
      ]
    `;

    try {
      const response = await fetch(`https://moodmap.opiian32.workers.dev/`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }]
        })
      });

      if (!response.ok) throw new Error("API 回傳錯誤");

      const data = await response.json();
      let textResult = data.candidates[0].content.parts[0].text;
      textResult = textResult.replace(/```json/g, "").replace(/```/g, "").trim();
      const places = JSON.parse(textResult);

      document.getElementById('loading-page').classList.add('hidden');
      document.getElementById('result-page').classList.remove('hidden');

      let listHtml = "";
      places.forEach(place => {
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.name)}`;
        listHtml += `
          <div class="result-item">
            <span class="place-name">${place.name}</span>
            <span class="match-score">${place.matchPercentage}% 推薦</span>
            <p style="margin-top:10px; color:#475569; margin-bottom:15px; line-height: 1.5;">${place.description}</p>
            <a href="${mapUrl}" target="_blank" class="map-btn">在 Google Maps 查看路線</a>
          </div>
        `;
      });
      document.getElementById('places-list').innerHTML = listHtml;

    } catch (error) {
      console.error("錯誤:", error);
      alert("發生錯誤 請按 F12 打開 Console 查看");
      document.getElementById('loading-page').classList.add('hidden');
      document.getElementById('quiz-page').classList.remove('hidden');
    }
  }

  renderQuestion();
</script>
</body>
</html>
