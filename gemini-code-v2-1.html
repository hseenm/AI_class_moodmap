<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>旅遊尋寶趣</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #f4f4f9; line-height: 1.6; }
  .container { background: white; padding: 20px; border-radius: 8px; max-width: 600px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
  .hidden { display: none; }
  .question-text { font-size: 20px; font-weight: bold; margin-bottom: 20px; text-align: center; color: #333; }
  .options-group { display: flex; flex-direction: column; gap: 12px; }
  .option-btn { background: #e9ecef; color: #333; border: 2px solid #dee2e6; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 16px; transition: all 0.2s; text-align: center; }
  .option-btn:hover { background: #0056b3; color: white; border-color: #0056b3; }
  .progress-text { text-align: center; color: #6c757d; font-size: 14px; margin-bottom: 20px; }
  .result-item { padding: 15px; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 15px; background: #fff; }
  .place-name { font-size: 18px; font-weight: bold; color: #333; }
  .match-score { font-size: 18px; color: #e67e22; font-weight: bold; float: right; }
  #loading { text-align: center; font-size: 18px; color: #555; margin-top: 20px; }
  .restart-btn { background: #6c757d; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; margin-top: 20px; }
  
  /* 新增的 Google Maps 按鈕樣式 */
  .map-btn { 
    display: inline-block; 
    background: #28a745; 
    color: white; 
    text-decoration: none; 
    padding: 10px 15px; 
    border-radius: 6px; 
    font-size: 14px; 
    font-weight: bold;
    transition: background 0.2s;
    text-align: center;
    width: calc(100% - 30px); /* 扣除內距讓按鈕寬度適中 */
    margin-top: 10px;
  }
  .map-btn:hover { background: #218838; }
</style>
</head>
<body>

<div class="container" id="quiz-page">
  <h2 style="text-align: center;">心情導向尋寶測驗</h2>
  <div class="progress-text" id="progress"></div>
  <div class="question-text" id="question-title"></div>
  <div class="options-group" id="options-container"></div>
</div>

<div class="container hidden" id="loading-page">
  <div id="loading">AI 正在為你思考專屬行程 請稍候...</div>
</div>

<div class="container hidden" id="result-page">
  <h2 style="text-align: center;">AI 為你推薦的專屬景點</h2>
  <div id="places-list"></div>
  <button class="restart-btn" onclick="location.reload()">重新測驗</button>
</div>

<script>
  // 請在這裡貼上你申請到的 Google AI Studio 金鑰
  const API_KEY = "AIzaSyATawQg3YN88377eyhZHH3LAup26E0HxiY";

  const questions = [
    "我現在覺得精神百倍想要盡情活動",
    "我渴望享受獨處的安靜時光",
    "我現在想吃點好吃的來犒賞自己",
    "我想要去戶外呼吸新鮮空氣",
    "我覺得壓力有點大需要徹底放鬆",
    "我想要探索沒去過的新鮮地方",
    "我現在對音樂或文創藝術充滿興趣",
    "我想要進行一些消耗體力的行程",
    "我想要沉浸在懷舊復古的氛圍中",
    "我覺得有點疲憊不想思考太複雜的事"
  ];

  const options = ["非常不同意", "不同意", "普通", "同意", "非常同意"];

  let currentIndex = 0;
  let userSummary = "";

  const progressEl = document.getElementById('progress');
  const questionTitleEl = document.getElementById('question-title');
  const optionsContainer = document.getElementById('options-container');

  function renderQuestion() {
    progressEl.innerText = `目前進度：第 ${currentIndex + 1} 題 / 共 ${questions.length} 題`;
    questionTitleEl.innerText = questions[currentIndex];
    
    optionsContainer.innerHTML = "";
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt;
      btn.onclick = () => selectOption(opt);
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(answer) {
    userSummary += `對於「${questions[currentIndex]}」這件事 使用者的態度是：${answer} \n`;
    currentIndex++;

    if (currentIndex < questions.length) {
      renderQuestion();
    } else {
      submitToAI();
    }
  }

  async function submitToAI() {
    document.getElementById('quiz-page').classList.add('hidden');
    document.getElementById('loading-page').classList.remove('hidden');

    const promptText = `
      你是一位具備心理學背景的彰化在地旅遊達人
      請分析以下使用者的心情狀態：
      ${userSummary}
      
      請推薦三個位於彰化縣且真實存在的景點或店家
      地點必須契合使用者的當下情緒
      請嚴格遵守輸出格式
      只能回傳純 JSON 陣列格式
      請勿包含任何其他標記或 markdown 符號
      [
        {
          "name": "景點名稱",
          "matchPercentage": 95,
          "description": "地點特色與推薦理由"
        }
      ]
    `;

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${API_KEY}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }]
        })
      });

      if (!response.ok) {
        const errorData = await response.text();
        console.error("API 回傳錯誤代碼:", errorData);
        alert("API 呼叫失敗 請按 F12 查看主控台的錯誤代碼");
        document.getElementById('loading-page').classList.add('hidden');
        document.getElementById('quiz-page').classList.remove('hidden');
        return;
      }

      const data = await response.json();
      let textResult = data.candidates[0].content.parts[0].text;
      
      textResult = textResult.replace(/```json/g, "").replace(/```/g, "").trim();
      const places = JSON.parse(textResult);

      document.getElementById('loading-page').classList.add('hidden');
      document.getElementById('result-page').classList.remove('hidden');

      let listHtml = "";
      places.forEach(place => {
        // 將 AI 生成的景點名稱編碼，組裝成標準的 Google Maps 搜尋連結
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.name)}`;
        
        listHtml += `
          <div class="result-item">
            <span class="place-name">${place.name}</span>
            <span class="match-score">${place.matchPercentage}% 推薦</span>
            <p style="margin-top:10px; color:#555; margin-bottom:15px;">${place.description}</p>
            <a href="${mapUrl}" target="_blank" class="map-btn">在 Google Maps 查看路線</a>
          </div>
        `;
      });
      document.getElementById('places-list').innerHTML = listHtml;

    } catch (error) {
      console.error("程式執行與解析錯誤:", error);
      alert("發生錯誤 請按 F12 打開 Console 主控台查看詳細原因");
      document.getElementById('loading-page').classList.add('hidden');
      document.getElementById('quiz-page').classList.remove('hidden');
    }
  }

  renderQuestion();
</script>
</body>
</html>
